<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade prática</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      color: darkblue;
    }

    p {
      font-size: 16px;
    }

    ol, ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 5px;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    form {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input[type="submit"] {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: darkblue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: navy;
    }
  </style>
</head>
<body>

  <h1>Aula dia 17/04</h1>

  <p>Aula de revisão sobre os conceitos básicos de hhtml e css.</p>

  <br>

  <ol>
    <li>Primeiro item</li>
    <li>Segundo item</li>
    <li>Terceiro item</li>
  </ol>

  <ul>
    <li>Primeiro item</li>
    <li>Segundo item</li>
    <li>Terceiro item</li>
  </ul>

  <img src="assets/imagem-exemplo.webp" alt="Lula Molusco bonitão">

  <table>
    <tr>
      <th>Cabeçalho 1</th>
      <th>Cabeçalho 2</th>
    </tr>
    <tr>
      <td>Dados 1</td>
      <td>Dados 2</td>
    </tr>
    <tr>
      <td>Dados 3</td>
      <td>Dados 4</td>
    </tr>
  </table>

  <form action="/enviar-dados" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem"></textarea>

    <input type="submit" value="Enviar">
  </form>

</body>
</html>
